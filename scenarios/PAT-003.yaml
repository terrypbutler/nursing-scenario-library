case_id: PAT-003
title: Discharge understanding after a new stoma
synthetic_data_notice: Entirely fictional training case
field: adult nursing
setting: colorectal surgical ward
complexity: introductory
estimated_duration_minutes: 20
patient:
  display_name: Aisha Khan
  age: 54
  pronouns: she/her
  preferred_address: Aisha
  communication_needs:
  - Prefers short sections of information followed by time for questions
  explicit_preferences:
  - Wants personal-care discussions conducted with the curtain closed
  - Would like her chosen family member involved only after she gives permission
  dialogue_style: Warm but embarrassed; may agree quickly when overloaded
  nonverbal_palette:
  - Aisha glances towards the curtain before answering.
  - She nods quickly, then hesitates as if reconsidering what she has understood.
  - Her shoulders relax a little when the conversation slows down.
learning:
  outcomes:
  - Create privacy and seek permission before a sensitive discussion
  - Explore the person's priorities and concerns
  - Use chunking and teach-back to check understanding
  - Identify gaps that require review before discharge
  nmc_platforms:
  - Being an accountable professional
  - Providing and evaluating care
  - Coordinating care
prebrief:
  role: You are the student nurse checking whether Aisha is ready for discharge education after a new
    simulated stoma.
  orientation: Create the conditions for a sensitive conversation, explore what matters and distinguish
    agreement from demonstrated understanding.
  resources:
  - Synthetic discharge handover
  - Folded educator-authored leaflet represented in text
  - Specialist-review pathway placeholder and nursing notes
  limitations:
  - The app does not teach or assess a real stoma-care procedure
  - Only educator-authored discharge facts can be revealed
  - AI cannot clear discharge or create new complications
  ground_rules:
  - Sensitive information should be handled with privacy and permission
  - Treat apparent agreement as something to explore, not proof of understanding
  - Use debrief to examine uncertainty without automatic pass or fail
clinical:
  presenting_context: Preparing for discharge after formation of a new simulated stoma
  visible_at_start:
  - Discharge leaflet remains folded on the bedside table
  - Aisha says she is ready to go home
  - She glances towards the open curtain before discussing care
  allergy_record: Not relevant to this conversation scenario
  prescribed_items: []
  baseline_observations: {}
clinical_workspace:
  handover: Aisha may be discharged after the planned education and specialist review. She has said she
    is ready, but the leaflet is still folded and no teach-back has been documented.
  environment:
  - Curtain is open to the bay
  - A folded discharge leaflet is on the bedside table
  - A visitor may be invited only if Aisha chooses
  available_resources:
  - Educator-authored discharge leaflet
  - Private discussion space
  - Specialist stoma-review placeholder
  - Nursing notes
  record_access: []
initial_state:
  elapsed_minutes: 0
  privacy_created: false
  permission_for_discussion: false
  concerns_explored: false
  information_chunked: false
  teach_back_used: false
  understanding_level: 1
  overload_level: 2
  family_permission: not_asked
  trust: 40
  emotion_state: embarrassed
  fatigue_level: 2
  confusion_level: 0
  dignity_state: vulnerable
  consent_state: not_asked
  revealed_cues: []
time_events:
- event_id: rushed_agreement
  at_minute: 7
  when:
    information_chunked: false
    teach_back_used: false
  effects:
    overload_level: 4
    trust_delta: -3
    emotion_state: overwhelmed
  visible_cue: Aisha nods repeatedly but cannot describe the first step she would take at home.
allowed_actions:
- action_id: create_privacy
  label: Create privacy for the discussion
  preconditions: {}
  effects:
    privacy_created: true
    dignity_state: protected
    trust_delta: 6
  reveals: []
- action_id: seek_discussion_permission
  label: Ask permission to discuss stoma care
  preconditions:
    privacy_created: true
  effects:
    permission_for_discussion: true
    consent_state: accepted
    trust_delta: 2
  reveals:
  - Aisha agrees to the discussion
  blocked_message: Aisha looks towards the open curtain and asks for privacy first.
- action_id: explore_concerns
  label: Ask what matters most about managing at home
  preconditions:
    permission_for_discussion: true
  effects:
    concerns_explored: true
    overload_level_delta: -1
    trust_delta: 7
    emotion_state: relieved_to_be_asked
  reveals:
  - Aisha is worried about leakage while outside the house
- action_id: explain_in_chunks
  label: Explain one authored care step at a time
  preconditions:
    permission_for_discussion: true
  effects:
    information_chunked: true
    understanding_level_delta: 1
    overload_level_delta: -1
  reveals:
  - Use only educator-authored discharge content
- action_id: use_teach_back
  label: Ask Aisha to explain the plan in her own words
  preconditions:
    information_chunked: true
  effects:
    teach_back_used: true
    understanding_level_delta: 1
    emotion_state: thoughtful
  reveals:
  - Aisha recalls routine care but is unsure whom to contact about a problem
  blocked_message: Provide a short, authored explanation before checking recall.
- action_id: seek_family_permission
  label: Ask whether Aisha wants her chosen family member involved
  preconditions:
    permission_for_discussion: true
  effects:
    family_permission: accepted
  reveals:
  - Aisha chooses to involve her sister in the final review
- action_id: arrange_specialist_review
  label: Arrange review by the appropriate specialist before discharge
  preconditions:
    teach_back_used: true
  effects:
    understanding_level_delta: 1
  reveals:
  - A specialist review is added to the simulated plan
  blocked_message: First establish the specific gap in understanding.
ai_contract:
  allowed_context:
  - Patient communication profile
  - Currently revealed concerns
  - Understanding and overload levels
  - Privacy and family-permission states
  - Bounded patient-experience state
  - Student's exact words
  allowed_state_keys:
  - privacy_created
  - permission_for_discussion
  - concerns_explored
  - information_chunked
  - teach_back_used
  - understanding_level
  - overload_level
  - family_permission
  - trust
  - emotion_state
  - fatigue_level
  - confusion_level
  - dignity_state
  - consent_state
  may_generate:
  - Patient dialogue
  - Embarrassment or relief
  - Visible behaviour
  - Questions
  must_not_generate:
  - Observations or observation values
  - Diagnosis or new clinical complications
  - Treatment recommendations or effects
  - Clinical stoma-care instructions
  - Discharge clearance
  - New complications
  - Consent to involve family
  - Judgement or grading of the student
facilitator_only:
  opening_brief: The learner is asked to check whether Aisha is ready for discharge education.
  expected_safety_points:
  - Privacy and consent precede the sensitive discussion
  - Agreement is not treated as proof of understanding
  - An identified knowledge gap leads to appropriate review
  pause_triggers:
  - Learner shares information with a family member without Aisha's permission
educator_rubric:
- criterion_id: privacy_permission
  label: Privacy and permission
  guidance: Creates privacy and confirms Aisha is willing to discuss sensitive care before proceeding.
- criterion_id: priorities
  label: Exploration of priorities
  guidance: Elicits Aisha's practical concern instead of relying on her initial reassurance.
- criterion_id: health_literacy
  label: Chunking and teach-back
  guidance: Uses short sections and checks understanding in a non-testing, non-shaming way.
- criterion_id: coordination
  label: Appropriate coordination
  guidance: Responds to the revealed knowledge gap and respects Aisha's choice about family involvement.
debrief:
  prompts:
  - What was the difference between agreement and demonstrated understanding?
  - How did privacy affect the conversation?
  - Which concern changed the discharge teaching plan?
  automatic_competence_decision: false
scenario_version: 1.0.0
publication_status: development
review:
  status: pending_local_clinical_review
  reviewer: ''
  reviewed_at: ''
dialogue:
  opening_line: They said I might go home today. I think I've understood everything.
  action_responses:
    create_privacy: Thank you. I didn't want everyone passing by to hear this.
    seek_discussion_permission: Yes, we can talk about it now.
    explore_concerns: I'm most worried about it leaking when I'm out. I keep saying I'm fine, but I don't
      really know what I would do.
    explain_in_chunks: That was easier to follow when we took one part at a time.
    use_teach_back: I can explain the routine part, but I'm not sure who I should contact if something
      goes wrong.
    seek_family_permission: Yes, I would like my sister to join us for the final review.
    arrange_specialist_review: That would reassure me before I go home.
  fallback_responses:
  - Could we take that slowly? I don't want to pretend I understand.
  - Aisha listens, then glances at the folded leaflet.
  facts:
  - fact: She is worried about leakage when outside the house but may initially say she is fine.
    when: {}
  - fact: She can describe routine care but is unsure whom to contact if a problem occurs.
    when:
      teach_back_used: true
  - fact: She has chosen to involve her sister in the final review.
    when:
      family_permission: accepted
  action_phrases:
    create_privacy:
    - create privacy
    - provide privacy
    - close the curtains
    - private discussion
    seek_discussion_permission:
    - ask permission to discuss
    - seek permission to discuss
    - ask if we can talk
    - permission to talk
    explore_concerns:
    - explore concerns
    - ask about concerns
    - ask what matters
    - managing at home
    - worries about home
    explain_in_chunks:
    - explain in chunks
    - one step at a time
    - break down explanation
    - explain care step
    use_teach_back:
    - use teach back
    - teach back
    - explain in her own words
    - repeat the plan
    - check understanding
    seek_family_permission:
    - ask about family involvement
    - involve family
    - family member involved
    - seek family permission
    - ask about her sister
    arrange_specialist_review:
    - arrange specialist review
    - request specialist review
    - refer to stoma nurse
    - specialist before discharge
